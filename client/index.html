<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FlowTrack — track your work, focus deeply, and grow consistently." />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="/flowtrack-favicon.png" />
    <link rel="apple-touch-icon" href="/flowtrack-mark-512.png" />
    <title>FlowTrack — Track. Focus. Grow.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before first paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem("personal-os-ui");
          var theme = stored ? JSON.parse(stored).state.theme : "system";
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
